<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U3M — Urbano Beat Maker</title>
<meta name="description" content="Tienda de beats, drum kits, sample packs y plugins urbanos con licencias por producto.">
<meta name="theme-color" content="#0c0c0c">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#0c0c0c;--ink:#f5f5f5;--soft:#d4d4d4;--mute:#a3a3a3;--line:#262626;--line2:#383838;--smoke:#1a1a1a;--red:#e10600;--red2:#ff3b30;--r-card:28px;--r-panel:36px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1520px;margin:0 auto;padding:0 clamp(16px,3vw,48px)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.display{font-weight:900;font-stretch:112%;text-transform:uppercase;line-height:.9;letter-spacing:-.03em}
.bar{display:block;height:8px;width:220px;max-width:60%;background:var(--red)}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;border:0;font-weight:800;font-size:16px;transition:background .2s,color .2s}
.btn-dark{background:#0c0c0c;color:#fff}.btn-dark:hover{background:var(--red)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#c80500}
.btn-light{background:var(--ink);color:var(--paper)}.btn-light:hover{background:var(--red);color:#fff}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:6px 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
/* header */
header.site{position:sticky;top:0;z-index:30;background:rgba(12,12,12,.9);backdrop-filter:blur(10px)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:20px;height:92px}
.logo img{height:52px;width:auto}
nav.main{display:flex;gap:4px;background:var(--smoke);border-radius:999px;padding:6px}
nav.main a,nav.main button{padding:10px 18px;border-radius:999px;border:0;background:transparent;color:var(--soft);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
nav.main a:hover,nav.main button:hover{color:var(--ink)}
nav.main .active{background:var(--ink);color:var(--paper)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--red)}
.hact{display:flex;gap:10px;align-items:center}
.icon-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--smoke);display:grid;place-items:center;position:relative}
.badge[hidden]{display:none}
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.menu-btn{display:none}
.mega{position:absolute;left:0;right:0;top:100%}
.mega[hidden]{display:none}
.mega-inner{display:grid;grid-template-columns:1fr 1fr 290px;gap:6px;background:var(--smoke);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.mega a.cat{padding:14px 16px;border-radius:18px;display:block}
.mega a.cat:hover{background:var(--paper)}
.mega a.cat b{display:block;font-size:17px}
.mega a.cat span{display:block;color:var(--mute);font-size:14px;margin-top:3px}
.mega .all{grid-column:1/-1;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-weight:800}
/* hero */
.hero{margin-top:16px;border-radius:var(--r-panel);background:#fff;color:#0c0c0c;padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;overflow:hidden}
.hero h1{margin:0;font-size:clamp(48px,7.4vw,112px)}
.hero p.lead{font-size:clamp(17px,1.4vw,20px);line-height:1.55;color:#3a3a3a;max-width:520px;margin:0 0 30px}
.hero-art{position:relative;aspect-ratio:1;max-width:460px;width:100%;margin:0 auto}
.np{position:absolute;left:0;bottom:6%;display:flex;gap:14px;align-items:center;background:#0c0c0c;color:#fff;border-radius:20px;padding:14px 18px;max-width:92%}
.np .play{width:44px;height:44px;border-radius:50%;background:var(--red);border:0;display:grid;place-items:center;flex:none;color:#fff}
.features{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
.features li{list-style:none;background:var(--smoke);border-radius:22px;padding:20px}
.features li b{display:block;font-size:18px}
.features li span{color:var(--mute);font-size:14px}
.features li.hot{background:var(--red)}.features li.hot span{color:#ffe1df}
section.block{margin-top:96px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px}
.sh h2{margin:0;font-size:clamp(36px,4.6vw,56px)}
.sh .bar{width:96px;margin-top:14px}
.sh a{font-weight:700;color:var(--red2)}
/* product grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:var(--smoke);border-radius:var(--r-card);padding:14px;display:flex;flex-direction:column;cursor:pointer;transition:transform .25s}
.card:hover{transform:translateY(-4px)}
.cover{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.cover-empty{width:100%;height:100%;background:linear-gradient(135deg,#262626,#0c0c0c)}
.card:hover .cover img{transform:scale(1.04)}
.cover .chip{position:absolute;top:12px;left:12px;background:#0c0c0c;color:#fff}
.cover .pbtn{position:absolute;right:12px;bottom:12px;width:56px;height:56px;border-radius:50%;border:0;background:#fff;color:#0c0c0c;display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:.25s}
.card:hover .pbtn,.pbtn[aria-pressed="true"]{opacity:1;transform:none}
.cbody{padding:16px 8px 6px;display:flex;flex-direction:column;gap:8px;flex:1}
.cbody .meta{color:var(--mute)}
.cbody h3{margin:0;font-size:21px;font-weight:900;font-stretch:108%;text-transform:uppercase;line-height:1.05}
.cfoot{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-weight:900;font-size:21px}
.price small{display:block;font-size:12px;color:var(--mute);font-weight:500;font-family:'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.cfoot .btn{height:44px;padding:0 18px;font-size:14px}
/* categories pills */
.pills{display:flex;flex-wrap:wrap;gap:12px}
.pills a{padding:16px 26px;border-radius:999px;border:2px solid var(--line2);font-weight:700;font-size:clamp(16px,1.5vw,21px)}
.pills a:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pills a.first{background:var(--red);border-color:var(--red);color:#fff}
.process{border-radius:var(--r-panel);background:var(--smoke);padding:clamp(28px,5vw,72px);display:grid;grid-template-columns:5fr 7fr;gap:40px}
.process ol{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0;padding:0}
.process li{list-style:none;background:var(--paper);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:22px}
/* catalog */
.cat-layout{display:grid;grid-template-columns:260px 1fr;gap:40px;margin-top:20px}
.side h4{margin:0 0 12px}
.side a{display:block;padding:9px 14px;border-radius:999px;color:var(--soft);font-weight:600}
.side a.sub{padding-left:30px;font-weight:500;color:var(--mute)}
.side a:hover{color:var(--ink)}
.side a.on{background:var(--ink);color:var(--paper)}
.search{display:flex;align-items:center;gap:12px;background:var(--smoke);border-radius:999px;padding:0 20px;height:56px;margin-bottom:20px}
.search input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:18px}
.grid.cat3{grid-template-columns:repeat(3,1fr)}
.empty{background:var(--smoke);border-radius:var(--r-card);padding:48px}
.ph{padding:48px 0 8px}.ph h1{margin:0;font-size:clamp(48px,7vw,104px)}.ph .bar{width:96px;margin-top:20px}
/* product page */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:28px;align-items:start}
.pd .cover{border-radius:var(--r-card)}
.pd h1{margin:14px 0 0;font-size:clamp(40px,5vw,72px)}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.specs div{background:var(--smoke);border-radius:18px;padding:14px 16px}
.specs span{display:block;color:var(--mute)}
.specs b{font-size:18px}
.lic{display:grid;gap:10px;margin:22px 0}
.lic label{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--smoke);border:2px solid transparent;border-radius:22px;padding:18px 20px;cursor:pointer}
.lic label:hover{border-color:var(--line2)}
.lic input{position:absolute;opacity:0}
.lic input:checked+label{border-color:var(--red)}
.lic b{font-size:18px}.lic small{display:block;color:var(--mute);margin-top:3px}
.lic .lp{font-weight:900;font-size:22px}
.note{color:var(--mute);font-size:14px;line-height:1.5}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(440px,calc(100% - 24px));background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);z-index:61;display:flex;flex-direction:column;overflow:hidden}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.drawer .items{flex:1;overflow:auto;padding:12px 22px}
.ci{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ci img{border-radius:14px}
.drawer footer{padding:20px 22px;border-top:1px solid var(--line);display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:14px 22px;border-radius:999px;font-weight:700;z-index:80;max-width:calc(100% - 32px)}
footer.site{margin-top:120px}
.fbox{border-radius:var(--r-panel);background:var(--smoke);padding:clamp(28px,4vw,56px);display:grid;grid-template-columns:5fr 2fr 2fr;gap:40px}
.fbox h3{margin:0;font-size:clamp(32px,3.6vw,48px)}
.fbox ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;color:var(--soft)}
.wordmark{font-size:9.4vw;white-space:nowrap;margin:40px 0 0;line-height:.8}
.fbot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute);padding:22px 0;border-top:1px solid var(--line);margin-top:24px}
.mnav{position:fixed;inset:0;z-index:70;background:var(--paper);padding:24px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.mnav a{font-size:34px;font-weight:900;font-stretch:112%;text-transform:uppercase;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:1100px){nav.main{display:none}.menu-btn{display:grid}.grid{grid-template-columns:repeat(2,1fr)}.grid.cat3{grid-template-columns:repeat(2,1fr)}.features{grid-template-columns:repeat(2,1fr)}.cat-layout{grid-template-columns:1fr !important}.side{display:none}.mega-inner{grid-template-columns:1fr}}
@media (max-width:760px){.hero{grid-template-columns:1fr}.grid,.grid.cat3{grid-template-columns:1fr}.features{grid-template-columns:1fr}.process{grid-template-columns:1fr}.process ol{grid-template-columns:1fr}.pd{grid-template-columns:1fr}.fbox{grid-template-columns:1fr}.hrow{height:76px}.logo img{height:42px}.hact .btn{display:none}.ci{grid-template-columns:56px 1fr auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="assets/css/store-theme.css">
</head>
<body>
<header class="site" id="hdr">
  <div class="wrap hrow">
    <button class="icon-btn menu-btn" aria-label="Abrir menú" data-action="open-menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a href="#/" class="logo" aria-label="U3M Urbano Beat Maker, inicio"><img src="logo.png" alt="U3M Urbano Beat Maker" width="115" height="52"></a>
    <nav class="main" aria-label="Principal" id="nav"></nav>
    <div class="hact">
      <a href="#/catalogo" class="icon-btn" aria-label="Buscar en el catálogo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
      <button class="icon-btn" aria-label="Abrir carrito" data-action="open-cart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg><span class="badge" id="badge" hidden>0</span></button>
      <a class="btn btn-red" id="accountBtn" href="#" style="height:46px;padding:0 22px">Entrar</a>
    </div>
  </div>
  <div class="mega" id="mega" hidden><div class="wrap" style="padding-bottom:24px"><div class="mega-inner" id="megaInner"></div></div></div>
</header>
<main id="app"><div class="wrap ph"><p class="note">Cargando…</p></div></main>
<footer class="site">
  <div class="wrap">
    <div class="fbox">
      <div><h3 class="display">Herramientas sonoras<br>para gente que <span style="color:var(--red)">termina</span> canciones.</h3></div>
      <div><p class="mono" style="color:var(--mute)">Tienda</p><ul><li><a href="#/catalogo">Catálogo completo</a></li><li><a href="#/catalogo/drum-kits">Drum Kits</a></li><li><a href="#/catalogo/sample-packs">Sample Packs</a></li><li><a href="#/catalogo/plugins">Plugins</a></li></ul></div>
      <div><p class="mono" style="color:var(--mute)">Ayuda</p><ul><li><a href="#/contacto">Contacto</a></li><li><a href="#/legal/terminos">Términos y condiciones</a></li><li><a href="#/legal/privacidad">Privacidad</a></li></ul></div>
    </div>
    <p class="display wordmark" aria-hidden="true">Urbano <span style="color:var(--red)">Beat</span> Maker</p>
    <div class="fbot mono"><span>© U3M — Urbano Beat Maker</span><span><a href="#/nosotros">Nosotros</a></span></div>
  </div>
</footer>
<div id="player" role="region" aria-label="Reproductor de muestras" aria-live="polite">
  <img class="pl-cover" id="plCover" alt="" hidden>
  <div class="pl-info"><b id="plTitle"></b><span>Muestra</span></div>
  <button class="pl-btn" id="plToggle" aria-label="Pausar muestra"></button>
  <button class="pl-close" id="plClose" aria-label="Cerrar reproductor"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="pl-bar"><span id="plProgress"></span></div>
</div>
<div id="layer"></div>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
