<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel — U3M</title>
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--panel:#161616;--panel2:#1f1f1f;--line:#2a2a2a;--ink:#f5f5f5;--mute:#a3a3a3;--red:#e10600;--ok:#1f9d55;--warn:#d97706;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1,h2,h3{margin:0;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
h1{font-size:34px}h2{font-size:22px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{border-color:#555}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent}
input,select,textarea{background:#0f0f0f;border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
label{display:grid;gap:6px;font-size:13px;color:var(--mute)}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
label.chk input{width:auto}
.field-err{color:#ff6b6b;font-size:13px;min-height:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--panel2);font-size:12px;margin:2px}
.st-published{background:#0f3d24;color:#7ef0a8}.st-draft{background:#3b3b3b;color:#ddd}.st-archived{background:#4a2c00;color:#ffc27a}
.st-paid{background:#0f3d24;color:#7ef0a8}.st-pending{background:#3b3b3b}.st-manual_review{background:#4a2c00;color:#ffc27a}.st-rejected,.st-failed,.st-cancelled,.st-refunded{background:#4a1111;color:#ff9b9b}.st-approved{background:#0f3d24;color:#7ef0a8}
.st-published,.st-draft,.st-archived,.st-paid,.st-pending,.st-manual_review,.st-rejected,.st-failed,.st-cancelled,.st-refunded,.st-approved{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
/* layout */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside.side{background:#000;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside.side .brand{display:flex;align-items:center;gap:10px;margin:0 8px 22px}
aside.side .brand img{height:36px}
aside.side nav{display:grid;gap:2px}
aside.side nav a{padding:9px 12px;border-radius:12px;color:var(--mute);text-decoration:none;font-weight:600;cursor:pointer}
aside.side nav a:hover{color:var(--ink);background:var(--panel)}
aside.side nav a.on{background:var(--ink);color:#000}
aside.side .group{margin:16px 12px 6px}
main.content{padding:28px clamp(16px,3vw,40px);min-width:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.toolbar input,.toolbar select{width:auto;min-width:180px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi b{display:block;font-size:30px;font-weight:900;margin-top:8px}
.bars{height:14px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:12px}
.bars>span{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:22px;max-width:920px;width:100%;max-height:92vh;overflow:auto;padding:24px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 18px;border-radius:999px;font-weight:700;z-index:60}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(420px,100%);display:grid;gap:14px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:14px}
.progress{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:6px}
.progress>span{display:block;height:100%;background:var(--ok);width:0}
.files-list{display:grid;gap:8px;margin-top:10px}
.file-row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#0f0f0f;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
audio{width:100%;margin-top:6px}
@media (max-width:900px){.shell{grid-template-columns:1fr}aside.side{position:static;height:auto}.kpis{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="app.js"></script>
</body>
</html>
